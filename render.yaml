services:
  - type: web
    name: gas-pos-backend
    env: python
    region: oregon  # or frankfurt, singapore, etc.
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set in Render dashboard after frontend deploy
      - key: RESERVE_ON_DEPOSIT
        value: "true"
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: gas-pos-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set in Render dashboard after backend deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true